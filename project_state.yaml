  secondary: [precision, f1, accuracy]
  thresholds:
    recall_minimo_aceptable: 0.85
    recall_objetivo: 0.90
    precision_minimo: 0.70
    f1_minimo: 0.80
  validation:
    method: "train_val_test split (70/15/15)"
    cv: "5-fold stratified sobre train"
    random_state: 42
    stratify: true

token_management:
