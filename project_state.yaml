# project_state.yaml
# Estado persistente del proyecto Hipócrates MCP / CardioRisk
# Actualizar al final de cada sesión o checkpoint
# v2 — Dataset corregido: jocelyndumlao/cardiovascular-disease-dataset

metadata:
  project_name: "Hipócrates MCP / CardioRisk"
  methodology: "CRISP-DM"
  current_phase: 4
  phase_name: "Modelado"
  start_date: "2026-01-15"
  last_updated: "2026-03-11"
  github_repo: "juanjararPYBM/ibm-data-science-portfolio"
  colab_base: "https://colab.research.google.com/github/juanjararPYBM/ibm-data-science-portfolio/blob/main/proyecto_medico"

dataset:
  name: "Cardiovascular Disease Dataset"
  author: "jocelyndumlao"
  kaggle_id: "jocelyndumlao/cardiovascular-disease-dataset"
  kaggle_url: "https://www.kaggle.com/datasets/jocelyndumlao/cardiovascular-disease-dataset"
  carga_codigo: |
    import kagglehub, os, glob
    path = kagglehub.dataset_download("jocelyndumlao/cardiovascular-disease-dataset")
    csv_files = glob.glob(os.path.join(path, "**", "*.csv"), recursive=True)
    df = pd.read_csv(csv_files[0])
    df.columns = [c.strip().replace(' ', '_') for c in df.columns]
  samples: 1000
  features_originales: 14
  columnas_raw:
    - patientid        # identificador — excluir del modelo
    - age              # edad del paciente
    - gender           # género (0=mujer, 1=hombre)
    - chestpain        # tipo de dolor torácico (0-3) — categórica → OHE
    - restingBP        # presión arterial en reposo (mmHg)
    - serumcholestrol  # colesterol sérico (mg/dl)
    - fastingbloodsugar  # glucosa en ayunas > 120 mg/dl (0/1)
    - restingrelectro  # ECG en reposo (0/1/2)
    - maxheartrate     # frecuencia cardíaca máxima alcanzada
    - exerciseangia    # angina inducida por ejercicio (0/1)
    - oldpeak          # depresión del segmento ST — marcador de isquemia
    - slope            # pendiente del segmento ST (0/1/2)
    - noofmajorvessels # número de vasos coronarios principales (0-3)
    - target           # 0=sin enfermedad, 1=enfermedad cardiovascular
  normalizacion_columnas:
    # resolver_columnas() normaliza case-insensitive a nombres canónicos
    restingBP: "restingBP"  # puede llegar como RestingBP, restingbp, etc.
  target: target
  positive_class: 1  # 1 = enfermedad cardiovascular (riesgo)
  negative_class: 0  # 0 = sin enfermedad (sano)

feature_engineering:
  # Aplicado en Fase 3 — df_feat
  nuevas_features:
    slope_x_oldpeak: "slope * oldpeak  — interacción isquémica"
    log_oldpeak: "log(oldpeak + 1)  — normalizar distribución sesgada"
    vessels_bin: "(noofmajorvessels >= 2).astype(int)  — umbral clínico enfermedad multivaso"
  encoding:
    chestpain: "One-Hot Encoding (pd.get_dummies, drop_first=False) → 4 columnas binarias"
  excluidos:
    - patientid       # identificador, no predictivo
    - gender_label    # string derivado de gender
    - age_group       # string derivado de age
    - chestpain       # reemplazado por columnas OHE

dataset_preparado:
  # Resultado de Fase 3 — artefactos exportados via %store a Fase 4
  features_finales: 16
  # Lista exacta de FEATURES_FINALES (post OHE + feature engineering):
  # age, gender, restingBP, serumcholestrol, fastingbloodsugar, restingrelectro,
  # maxheartrate, exerciseangia, oldpeak, slope, noofmajorvessels,
  # slope_x_oldpeak, log_oldpeak, vessels_bin,
  # chestpain_0, chestpain_1, chestpain_2, chestpain_3
  # (número exacto de columnas OHE depende de valores presentes en el dataset)
  splits:
    train: "70% — con SMOTE aplicado (X_train_sm, y_train_sm)"
    val:   "15% — sin SMOTE (X_val_sc, y_val)"
    test:  "15% — sellado hasta Fase 5 (X_test_sc, y_test)"
  scaling: "StandardScaler(μ=0, σ=1) — fit solo en train"
  smote: "SMOTE(random_state=42) — solo sobre X_train_sc"
  random_state: 42
  stratify: true
  artefactos_store:
    - X_train_sm
    - y_train_sm
    - X_val_sc
    - y_val
    - X_test_sc
    - y_test
    - scaler
    - FEATURES_FINALES
    - df_feat

experiments:
  completed: []
  planned:
    - id: EXP001
      model: "Logistic Regression"
      notes: "baseline — recuperar artefactos %store de F3, sin aplicar SMOTE ni class_weight doble"
      priority: 1
    - id: EXP002
      model: "Random Forest"
      notes: "optimización de n_estimators y max_depth"
      priority: 2
    - id: EXP003
      model: "XGBoost"
      notes: "scale_pos_weight para manejo de desbalance"
      priority: 3
    - id: EXP004
      model: "Ensemble"
      notes: "VotingClassifier con mejores modelos anteriores"
      priority: 4
  current_experiment: null

model:
  current: null
  best:
    name: null
    recall: null
    precision: null
    f1: null
    path: null
  persistence_format: joblib
  save_path: "./models/"

