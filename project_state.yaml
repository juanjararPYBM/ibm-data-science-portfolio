notes: |
  CORRECCIÓN v2 (2026-03-11): Dataset es jocelyndumlao/cardiovascular-disease-dataset
  (1000 muestras, 14 columnas), NO Cleveland UCI.
  
  Decisiones clave de Fase 3:
  - SMOTE aplicado SOLO en train para balancear clases
  - StandardScaler fit solo en train (sin data leakage)
  - chestpain → OHE (4 categorías sin orden)
  - 3 features engineered: slope_x_oldpeak, log_oldpeak, vessels_bin
  - Test set sellado hasta Fase 5
  
  Para Fase 4: recuperar artefactos via %store o re-ejecutar Fase 3 en la misma sesión Colab
